<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draftline</title>
    <base href="/" />
    <meta name="description"
          content="Draftline - локальный редактор low-fi вайрфреймов: каркас экрана из схематичных блоков без визуального шума." />

    <!-- What the browser's own chrome wears, and what the PWA is called once installed. -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="draftline.svg" />
    <link rel="apple-touch-icon" href="draftline.svg" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#14161b" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7fb" />

    <!--
      Flare's bootstrap: it paints the theme before .NET boots, so the page never appears in one look
      and then switches to another. The three data-default-* values are the same theme, palette and
      mode Program.cs registers - they have to agree, and this is the pair that is easiest to break.
      The theme is Fluent UI 2 built on itself with the layout's page padding removed, so its id is
      deliberately not "fluent2": what is painted here is exactly what Program.cs registers. Nothing on
      the first frame wears Fluent UI 2's scoped component styles, and the splash is styled by our own
      stylesheet with token fallbacks, so the one instant before .NET is up looks right either way.
    -->
    <script src="_content/Flare.Components/js/flare-bootstrap.js"
            data-default-theme="draftline-fluent2"
            data-default-palette="fluent-blue"
            data-default-mode="auto"></script>
    <link rel="stylesheet" href="_content/Flare.Components/css/flare-components.css" />
    <link rel="stylesheet" href="css/draftline.css" />
</head>

<body>
    <!-- The first frame, before a single line of .NET has run. FlareThemeProvider fades and removes
         an element with this id once the app is up, so the splash needs no script of its own. -->
    <div id="flare-splash">
        <span class="draftline-splash-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <strong>Draftline <small>low-fi wireframes</small></strong>
    </div>

    <div id="app"></div>

    <div id="blazor-error-ui">
        Draftline не смог запуститься. <a href="." class="reload">Перезагрузить</a>
        <span class="dismiss">×</span>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        // The service worker is what makes the editor open without a network. Registering it is the
        // only line of JavaScript the app needs of its own: everything else is Blazor or flare-*.js.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('service-worker.js');
            });
        }
    </script>
</body>

</html>
