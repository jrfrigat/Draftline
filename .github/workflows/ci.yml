name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore Draftline.slnx
      - run: dotnet build Draftline.slnx -c Release --no-restore -warnaserror
      - run: dotnet test --solution Draftline.slnx -c Release --no-build --report-trx --results-directory TestResults
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
      # The editor's JavaScript is plain modules the SDK copies as they are: nothing compiles them, so a
      # syntax error would first show up in a browser.
      - name: Check JavaScript syntax
        run: |
          for file in $(find src/Draftline.App/wwwroot -name '*.js'); do node --check "$file"; done
